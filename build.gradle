plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = project.archives_base_name
    version = project.mod_version
    group = project.maven_group
}

loom {
    // 将包私有的 GlDevice 提升为可访问（Skija 取主 Framebuffer 名字所需）
    accessWidenerPath = file('src/main/resources/yiyiaddon.accesswidener')

    runs {
        client {
            // 运行目录按线分流：26.1.2 主线沿用历史目录 run/（不搬迁既有环境），
            // 其余版本线各用 run-<版本>/。目录名对应 .gitignore 的 /run/ 与 /run-*/，不进版本库。
            // 依据：开发习惯.md 第三十六章第 232 条。
            runDir = file(project.minecraft_version == '26.1.2' ? 'run' : "run-${project.minecraft_version}")
            // 固定玩家名：离线 UUID 由名字派生，随机名会导致每次启动都是"新玩家"
            programArgs '--username', 'yiyijia'
            // 开发期窗口尺寸：面板按「窗口像素的一半」做设计空间，窗口太小会让面板整体缩得很难看清
            programArgs '--width', '1920', '--height', '1080'
            // 开发环境正版登录（DevAuth Neo）：开着才生效，它自己是默认关闭的。
            // 用系统属性而不是 ~/.dev-auth-neo/config.json —— 属性名是文档里写死的形式，不会猜错；
            // 令牌缓存在 ~/.dev-auth-neo/microsoft_accounts.json，不进仓库。
            vmArg '-Ddevauth.enabled=1'
            vmArg '-Ddevauth.account=main'
            // 登录流程：用系统浏览器（auth-code-external）。内嵌窗口流程（auth-code-embedded）要下 150MB 的 CEF，
            // 而且这台机器上 CEF 初始化失败、只弹一个白窗口登不进去，所以不用它。
            vmArg '-Ddevauth.microsoft.oauth2.grant-flow=auth-code-external'
        }
    }
}

repositories {
    // 本地仓库只承载无公开 Maven 坐标的第三方构件（当前仅 Baritone）
    maven {
        name = 'YiyiAddonLocal'
        url = uri('maven-repo')
    }
    // DevAuth Neo 只在 Modrinth 发布（开发环境登录用，见 dependencies 里的 localRuntime）
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // 26.1 起为官方/原生名称体系（26.2 相同），Loom 直接使用 Mojang artifacts，无需 mappings 声明
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Baritone（LGPL-3.0）：compileOnly 编译期类型；runtimeOnly 让开发期 Fabric Loader
    // 把它当独立 Mod 加载；include 以独立嵌套 jar 进发布产物（不 shade、不改包名，
    // 满足 LGPL 的可替换 / 可重链接条件）
    compileOnly "baritone:baritone-fabric:${project.baritone_version}"
    runtimeOnly "baritone:baritone-fabric:${project.baritone_version}"
    include "baritone:baritone-fabric:${project.baritone_version}"

    // Skija 2D 渲染器（Apache-2.0）
    implementation "io.github.humbleui:types:${project.skija_types_version}"
    include "io.github.humbleui:types:${project.skija_types_version}"
    implementation "io.github.humbleui:skija-shared:${project.skija_version}"
    include "io.github.humbleui:skija-shared:${project.skija_version}"
    runtimeOnly "io.github.humbleui:skija-windows-x64:${project.skija_version}"
    include "io.github.humbleui:skija-windows-x64:${project.skija_version}"
    runtimeOnly "io.github.humbleui:skija-windows-arm64:${project.skija_version}"
    include "io.github.humbleui:skija-windows-arm64:${project.skija_version}"

    // 开发环境正版登录（DevAuth Neo，MIT）：只在开发运行时存在，不进发布产物。
    // 用了 localRuntime 而不是 modLocalRuntime —— 26.1 起走官方名称体系（26.2 相同），不需要再做映射。
    localRuntime 'maven.modrinth:dev-auth-neo:1.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.jdk_version as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Mixin 注解处理器最高只支持 class file 65（Java 21），工具链仍是 Java 25
    options.release = 21
}

processResources {
    def propertyMap = [
            version         : project.version,
            minecraft_compat: project.minecraft_compat,
            loader_version  : project.fabric_loader_version,
            jdk_version     : project.jdk_version,
    ]

    inputs.properties(propertyMap)
    filesMatching('fabric.mod.json') {
        expand(propertyMap)
    }
}

// 普通构建供个人使用，以后缀区分，避免误把未混淆包当成公开发布包。
tasks.named('jar', Jar) {
    archiveClassifier = 'personal'
}

tasks.register('buildPersonal') {
    group = 'build'
    description = '构建带 personal 后缀的个人版。'
    dependsOn tasks.named('build')
}

// 发布混淆独立于开发构建；只处理本项目字节码，不改嵌套第三方依赖。
apply from: 'gradle/obfuscation.gradle'
