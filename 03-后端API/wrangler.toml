# Cloudflare Workers 配置文件（执行 wrangler 命令时工作目录为本目录）
name = "yiyiaddonadmin"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# 自定义域名绑定
routes = [
  { pattern = "yiyiaddon.asia", custom_domain = true }
]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "yiyiaddon-users"
database_id = "1a932013-be80-43f4-ae86-12b62ead7a0a"

# 环境变量
[vars]
ADMIN_USERNAME = "admin"
# 注意:真实密码通过 wrangler secret 设置,不要写在这里!
# 运行: npx wrangler secret put ADMIN_PASSWORD
