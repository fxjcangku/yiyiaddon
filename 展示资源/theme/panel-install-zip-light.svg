<path d="M24 72H364" stroke="#d0d7de"/>
<text id="card-0-line-0" x="24" y="112" font-size="22" font-weight="400" fill="#57606a">退出游戏，移出旧版 yiyiaddon</text>
<text id="card-0-line-1" x="24" y="148" font-size="22" font-weight="600" fill="#9a6700">卸载自行安装的 Baritone</text>
</g>
