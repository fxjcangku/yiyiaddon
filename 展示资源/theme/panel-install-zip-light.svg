<path d="M24 72H364" stroke="#d0d7de"/>
<text id="card-2-line-0" x="24" y="112" font-size="22" font-weight="400" fill="#57606a">启动游戏，按 G 打开主界面</text>
<text id="card-2-line-1" x="24" y="148" font-size="22" font-weight="400" fill="#57606a">按服务器情况配置模块与点位</text>
