<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
<title id="title">ZIP 安装步骤</title>
<desc id="desc">01 清理旧包：退出游戏，移出旧版 yiyiaddon，卸载自行安装的 Baritone；02 放入模组：解压对应版本 ZIP，取出 JAR，与 Fabric API 一起放入 mods；03 开始使用：启动游戏，按 G 打开主界面，按服务器情况配置模块与点位</desc>
