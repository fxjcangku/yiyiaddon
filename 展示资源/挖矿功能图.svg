<text x="38" y="102" font-size="33" font-weight="600" fill="#eff4f9">采掘之外，后勤也有安排。</text>
<text x="39" y="144" font-size="16" fill="#a5b5c8">目标采掘　/　满载卸货　/　食物与耐久</text>
