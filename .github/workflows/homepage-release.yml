name: 发布后更新首页、下载与历史归档
on:
  release:
    types: [published, edited, released, prereleased, unpublished, deleted]
  workflow_dispatch:
    inputs:
      migrate_legacy_zip:
        description: 将最新正式版旧ZIP原样迁移为JAR并核对后移除ZIP
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: public-homepage-release
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 读取公开首页
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: 从真实发布和附件更新首页与分类归档
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.migrate_legacy_zip }}" = 'true' ]; then
            python3 "工具/迁移旧发布为JAR.py"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/homepage-latest.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/homepage-catalog.json"
          node "工具/更新公开首页.mjs" --latest "$RUNNER_TEMP/homepage-latest.json" --catalog "$RUNNER_TEMP/homepage-catalog.json"
          git add -- README.md 发布说明/历史版本.md 展示资源/homepage-20261023/brand-compat.svg 展示资源/homepage-20261023/brand-compact-compat.svg 展示资源/homepage-20261023/download-26.1.2.svg 展示资源/homepage-20261023/download-26.2.svg 展示资源/homepage-20261023/download-26.3.svg
          for asset in brand-release.svg brand-compact-release.svg download-1.21.11-release.svg download-26.1.2-release.svg download-26.2-release.svg download-26.3-release.svg; do
            file="展示资源/homepage-20261023/$asset"
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          # 只暂存刷新工具生成的品牌、下载与平台组件，静态导航和功能卡由人工维护。
          for theme in light dark; do
            git add -- "展示资源/theme/brand-$theme.svg" "展示资源/theme/brand-compact-$theme.svg"
            for asset in panel-environment-platforms-$theme.svg panel-environment-platforms-compact-$theme.svg; do
              file="展示资源/theme/$asset"
              if [ -f "$file" ]; then git add -- "$file"; fi
            done
            for game in 1.21.11 26.1.2 26.2 26.3; do
              file="展示资源/theme/download-$game-$theme.svg"
              if [ -f "$file" ]; then git add -- "$file"; fi
            done
          done
          if git diff --cached --quiet; then
            echo '首页与分类归档已对应实际发布，无需重复提交。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '按实际发布更新正式版首页与分类归档'
          git push origin HEAD:master
