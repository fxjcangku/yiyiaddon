name: 发布已验收的beta6双版本附件

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-verified-v1.0-beta6
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'fxjcangku/yiyiaddon' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出公开成品
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            /发布附件/**
          sparse-checkout-cone-mode: false

      - name: 核对摘要并上传原样ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly repo='fxjcangku/yiyiaddon'
          readonly tag='v1.0-beta6'
          readonly asset_dir='发布附件'
          readonly main='yiyiaddon-1.0-beta6-26.1.2.zip'
          readonly port='yiyiaddon-1.0-beta6-26.2.zip'
          readonly main_sha='be3f74823dc6a1b73dbdda2c297c5ae0ea25329a9b03cc66ad08fb4630a3ff61'
          readonly port_sha='a11dc2f5f494d76a2f2462dfef42ebdd151c31414cc960cbff8f183fa80200f7'

          for name in "$main" "$port"; do
            cat "$asset_dir/$name.parts/"part[0-9][0-9][0-9] > "$asset_dir/$name"
          done

          printf '%s  %s\n' "$main_sha" "$asset_dir/$main" "$port_sha" "$asset_dir/$port" | sha256sum --check
          python - <<'PY'
          import zipfile
          from pathlib import Path
          for version in ('26.1.2', '26.2'):
              name = f'yiyiaddon-1.0-beta6-{version}'
              with zipfile.ZipFile(Path('发布附件') / (name + '.zip')) as archive:
                  if archive.namelist() != [name + '.jar'] or archive.testzip() is not None:
                      raise SystemExit('Unexpected or corrupt release ZIP: ' + name)
          PY

          gh api "repos/$repo/releases/tags/$tag" > "$RUNNER_TEMP/release-before.json"
          pending=()
          for name in "$main" "$port"; do
            expected="$main_sha"
            [[ "$name" == "$main" ]] || expected="$port_sha"
            size=$(stat --format='%s' "$asset_dir/$name")
            existing=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release-before.json")
            if [[ "$existing" == '0' ]]; then
              pending+=("$asset_dir/$name")
            else
              jq --exit-status --arg name "$name" --arg digest "sha256:$expected" --argjson size "$size" \
                '[.assets[] | select(.name == $name)] | length == 1 and all(.[]; .state == "uploaded" and .size == $size and .digest == $digest)' \
                "$RUNNER_TEMP/release-before.json" >/dev/null
            fi
          done
          if (( ${#pending[@]} )); then
            gh release upload "$tag" "${pending[@]}" --repo "$repo"
          fi

          gh api "repos/$repo/releases/tags/$tag" > "$RUNNER_TEMP/release-after.json"
          for name in "$main" "$port"; do
            expected="$main_sha"
            [[ "$name" == "$main" ]] || expected="$port_sha"
            size=$(stat --format='%s' "$asset_dir/$name")
            jq --exit-status --arg name "$name" --arg digest "sha256:$expected" --argjson size "$size" \
              '[.assets[] | select(.name == $name)] | length == 1 and all(.[]; .state == "uploaded" and .size == $size and .digest == $digest)' \
              "$RUNNER_TEMP/release-after.json" >/dev/null
          done
          jq '[.assets[] | select(.name == "yiyiaddon-1.0-beta6-26.1.2.zip" or .name == "yiyiaddon-1.0-beta6-26.2.zip") | {name,state,size,digest}]' \
            "$RUNNER_TEMP/release-after.json"
